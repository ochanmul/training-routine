      { name: "스프린트", volume: "8회", note: "전력 질주. 완전 복귀 후 숨 고르고 다음 세트", effect: "최대 속도 강화", input: "check" },
      { name: "실전 가속 인터벌", volume: "30m 질주 → 20m 조깅 × 6회", rest: "복귀 후 30-40초",
        note: "폼 무너지면 그 세트 즉시 종료", effect: "지친 상태 코어 통제력", input: "check" },
    ]
  },
  {
    id: "fieldc", label: "필드 C", title: "필드 Day C", subtitle: "Core Power",
    tag: "FIELD", color: "#e76f51", hasWarmCool: true, duration: "30-35분",
    exercises: [
      { name: "메디신볼 슬램", volume: "3세트 × 10회", rest: "휴식 1분",
        note: "머리 위로 들어 올린 메디신볼을 온몸의 힘으로 바닥에 내리침. 코어와 둔근 동시 수축",
        effect: "전신 폭발력 → 블로킹 충격 생성", input: "check" },
      { name: "로테이셔널 슬램", volume: "3세트 × 좌우 각 8회", rest: "휴식 1분",
        note: "메디신볼을 옆으로 들어 올렸다가 회전하며 바닥에 내리침. 골반 회전이 시작점",
        effect: "회전 폭발력 → 힙턴 순간 힘 전달", input: "check" },
      { name: "메디신볼 싯업스로", volume: "3세트 × 10회", rest: "휴식 1분",
        note: "바닥에 누워 싯업 하며 올라오는 순간 메디신볼을 파트너 또는 벽에 던짐",
        effect: "전면 코어 폭발력 → 스프린트 팔치기 연동", input: "check" },
    ]
  },
  {
    id: "recovery", label: "리커버리", title: "리커버리 Day", subtitle: "근막 이완 / 스트레칭",
    tag: "RECOVERY", color: "#2a9d8f", isRecovery: true,
  },
];

let selected = "helsa";
let recordData = {};
let checks = {};

function hex(color, alpha) {
  const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function today() {
  return new Date().toLocaleDateString("ko-KR", { year:"numeric", month:"2-digit", day:"2-digit" });
}
function showToast(msg, isError) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = isError ? "#5c1a1a" : "#1a3a2a";
  t.style.borderColor = isError ? "#a33" : "#2a9d8f";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}
function getInput(dayId, exIdx, field) { return recordData[dayId]?.[exIdx]?.[field] || ""; }
function setInput(dayId, exIdx, field, val) {
  if (!recordData[dayId]) recordData[dayId] = {};
  if (!recordData[dayId][exIdx]) recordData[dayId][exIdx] = {};
  recordData[dayId][exIdx][field] = val;
}
function getCheck(dayId, key) { return !!(checks[dayId]?.[key]); }
function toggleCheck(dayId, key) {
  if (!checks[dayId]) checks[dayId] = {};
  checks[dayId][key] = !checks[dayId][key];
  renderCard(); renderWarmCool();
}

function renderSelector() {
  document.getElementById("daySelector").innerHTML = days.map(d => `
    <button class="day-btn ${selected===d.id?'active':''}"
      style="${selected===d.id?`background:${d.color}`:''}"
      onclick="selectDay('${d.id}')">${d.label}</button>
  `).join("");
}

function renderFieldPrinciple() {
  const d = days.find(x => x.id === selected);
  document.getElementById("fieldPrinciple").innerHTML = d.tag === "FIELD" ? `
    <div class="field-principle">
      <span class="field-principle-label">필드 운영 원칙 </span>
      주 1회 → A 또는 B 택 1, 다음 주에 나머지 수행 · 주 2회 → A·B 각 1회, 사이 하루 이상 간격 필수
    </div>` : "";
}

function renderWarmCool() {
  const d = days.find(x => x.id === selected);
  const wu = document.getElementById("warmupToggle");
  const cd = document.getElementById("cooldownToggle");
  if (!d.hasWarmCool) { wu.innerHTML = ""; cd.innerHTML = ""; return; }

  const wuOpen = getCheck("toggle", `wu_${selected}`);
  wu.innerHTML = `<div class="toggle-section">
    <div class="toggle-header" onclick="toggleCheck('toggle','wu_${selected}')">
      <span class="toggle-title">🔥 웜업 스트레칭</span>
      <span class="toggle-arrow ${wuOpen?'open':''}">▼</span>
    </div>
    <div class="toggle-body ${wuOpen?'open':''}">
      ${WARMUP_ITEMS.map(i => `<div class="toggle-item">${i}</div>`).join("")}
    </div>
  </div>`;

  const cdOpen = getCheck("toggle", `cd_${selected}`);
  cd.innerHTML = `<div class="toggle-section">
    <div class="toggle-header" onclick="toggleCheck('toggle','cd_${selected}')">
      <span class="toggle-title">🧊 쿨다운 스트레칭</span>
      <span class="toggle-arrow ${cdOpen?'open':''}">▼</span>
    </div>
    <div class="toggle-body ${cdOpen?'open':''}">
      ${COOLDOWN_ITEMS.map(i => `<div class="toggle-item">${i}</div>`).join("")}
    </div>
  </div>`;
}

function renderCard() {
  const d = days.find(x => x.id === selected);
  const el = document.getElementById("cardArea");

  if (d.isRecovery) {
    el.innerHTML = `<div class="card">
      <div class="card-header">
        <div><div class="card-title">${d.title}</div><div class="card-sub">${d.subtitle}</div></div>
        <span class="tag" style="background:${d.color}">${d.tag}</span>
      </div>
      ${RECOVERY_ITEMS.map((item, i) => `
        <div class="check-row" onclick="toggleCheck('${d.id}','rec_${i}')">
          <div class="check-box ${getCheck(d.id,`rec_${i}`)?'checked':''}"></div>
          <div><div class="check-label">${item.name}</div><div class="check-sub">${item.sub}</div></div>
        </div>`).join("")}
    </div>`;
    return;
  }

  const body = d.exercises.map((ex, i) => {
    if (ex.input === "check") {
      return `<div class="check-row" onclick="toggleCheck('${d.id}','ex_${i}')">
        <div class="check-box ${getCheck(d.id,`ex_${i}`)?'checked':''}"></div>
        <div style="flex:1">
          <div class="check-label">${ex.name} <span style="font-size:12px; color:${d.color}; margin-left:6px;">${ex.volume}</span>${ex.rest?`<span style="font-size:11px; color:#555; margin-left:6px;">(${ex.rest})</span>`:''}</div>
          <div class="check-sub">${ex.note?ex.note:''}</div>
          ${ex.effect?`<div class="check-sub" style="color:${hex(d.color,0.7)}">→ ${ex.effect}</div>`:''}
        </div>
      </div>`;
    }
  }).join("");

  el.innerHTML = `<div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">${d.title}</div>
        <div class="card-sub">${d.subtitle}</div>
        ${d.duration?`<div class="card-duration">⏱ ${d.duration}</div>`:''}
      </div>
      <span class="tag" style="background:${d.color}">${d.tag}</span>
    </div>
    ${body}
  </div>`;
}

function renderMemo() {
  const saved = localStorage.getItem(`memo_${selected}`) || "";
  document.getElementById("memoArea").innerHTML = `
    <div class="memo-section">
      <div class="memo-header">📝 오늘의 메모</div>
      <div class="memo-body"><textarea id="memoText" placeholder="컨디션, 느낀 점, 개선할 것 등 자유롭게...">${saved}</textarea></div>
      <div class="memo-footer">
        <button class="btn btn-secondary" onclick="clearMemo()">초기화</button>
        <button class="btn btn-primary" id="saveBtn" onclick="saveRecord()">구글 시트에 저장</button>
      </div>
    </div>`;
}

function clearMemo() { document.getElementById("memoText").value = ""; }

async function saveRecord() {
  const pin = prompt("PIN 번호 4자리를 입력하세요");
  if (pin !== "6508") { showToast("PIN 번호가 틀렸어요", true); return; }
  const d = days.find(x => x.id === selected);
  const memo = document.getElementById("memoText").value.trim();
  const btn = document.getElementById("saveBtn");
  localStorage.setItem(`memo_${selected}`, memo);

  let rows = [];
  if (d.isRecovery) {
    rows = RECOVERY_ITEMS.map((item, i) => ({ exercise: item.name, set: getCheck(d.id,`rec_${i}`)?"✓":"-", weight:"-", reps:"-" }));
  } else {
    rows = d.exercises.map((ex, i) => {
      return { exercise: ex.name, set: getCheck(d.id,`ex_${i}`)?"✓":"-", weight:"-", reps:"-" };
    });
  }

  btn.disabled = true; btn.textContent = "저장 중...";
  try {
    await fetch(SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ type:"record", date:today(), dayLabel:d.label, dayTitle:d.title, memo, rows }) });
    showToast("✅ 구글 시트에 저장됐어요!");
  } catch { showToast("저장 실패 — 네트워크 확인해주세요", true); }
  btn.disabled = false; btn.textContent = "구글 시트에 저장";
}

function selectDay(id) {
  selected = id;
  renderSelector(); renderFieldPrinciple(); renderWarmCool(); renderCard(); renderMemo();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const quotes = [
  "안되면 될 때까지","억울하면 강해져라",
  "나는 무서워하면서\n끝까지 걸어가는 사람",
  "니가 있는 곳이 지옥이면\n멈출 이유가 더더욱 없다",
  "뭐라도 해야지","봤으면 해라",
  "벽장의 귀신은\n문을 여는 순간 사라진다",
  "도망치지 마라\n네가 질 싸움이 아니다",
  "Conditions will\nnever be perfect",
  "스스로를\n자랑스럽게 만들어라",
  "어제까지의 자신을 넘자",
  "1등은 아무나 하는게 아니다",
  "했을 때의 고통보다\n후회의 고통이 더 크다",
];

document.getElementById("mainQuote").innerHTML = q.replace(/\n/g,"<br>") + `<br><span class="header-sub">주간 스케줄</span>`;

selectDay("helsa");
</script>
